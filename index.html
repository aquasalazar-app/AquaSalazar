<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b10">
<meta name="description" content="Salazar Pay — controle simples das suas finanças">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Salazar Pay — V1</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b10;color:#f4f7fb;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0}
.app{max-width:1050px;margin:auto;padding:22px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}
.brand{font-size:25px;font-weight:850;letter-spacing:-.5px}.brand span{color:#6ee7b7}
.subtitle,.muted{color:#8b95a5;font-size:13px}
.primary{background:#6ee7b7;color:#06110c;border-radius:12px;padding:12px 16px;font-weight:800}
.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:16px}
.card{background:#10151d;border:1px solid #202a37;border-radius:19px;padding:19px;box-shadow:0 12px 35px #0004}
.salaryline{display:flex;align-items:center;gap:9px;margin-top:6px}.salary{font-size:30px;font-weight:850;letter-spacing:-.7px}
.smallbtn{background:#1d2733;color:#d7dee8;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:750}
.balance-label{margin-top:22px}.balance{font-size:35px;font-weight:850;margin:5px 0 17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#0b1017;border-radius:14px;padding:13px}.stat span{font-size:12px;color:#8994a4}.stat b{display:block;margin-top:5px;font-size:18px}
.in{color:#6ee7b7}.out{color:#fb7185}
.progress{height:10px;background:#222d3a;border-radius:99px;overflow:hidden;margin-top:9px}.bar{height:100%;width:0;background:#6ee7b7;transition:.25s}
.section{margin-top:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.accounts{margin-top:9px}.account{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #202833}
.account:last-child{border-bottom:0}.account-name{font-weight:750}.account-actions{display:flex;align-items:center;gap:8px}.account-value{font-weight:800}
.transactions{display:flex;flex-direction:column;gap:9px;margin-top:12px}.tx{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0b1017;border-radius:13px;padding:13px}.tx-title{font-weight:700}.tx small{display:block;color:#778292;margin-top:3px}.empty{text-align:center;color:#737e8d;padding:24px 8px}
.installment{margin-top:7px;color:#aeb8c6;font-size:12px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.open{display:flex}
.modalbox{width:min(440px,100%);max-height:92vh;overflow:auto;background:#111821;border:1px solid #293544;border-radius:19px;padding:20px}
h2{margin:0;font-size:20px}.field{margin-top:13px}.field label{display:block;color:#9aa5b5;font-size:12px;margin-bottom:5px}
input,select{width:100%;background:#0a0f15;color:#f4f7fb;border:1px solid #2a3544;border-radius:11px;padding:12px;outline:none}
.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.cancel{background:#202a36;color:white;border-radius:11px;padding:12px 15px;font-weight:700}
.hidden{display:none!important}
@media(max-width:760px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.top{align-items:flex-start}.brand{font-size:22px}.salary{font-size:27px}.balance{font-size:31px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div><div class="brand">Salazar <span>Pay</span></div><div class="subtitle">Seu dinheiro, sob controle.</div></div>
<button class="primary" onclick="openModal('txModal')">+ Adicionar</button>
</header>

<div class="layout">
<main>
<section class="card">
<div class="muted">Salário mensal</div>
<div class="salaryline"><div class="salary" id="salary"></div><button class="smallbtn" onclick="editSalary()">✏ Editar</button></div>
<div class="balance-label muted">Saldo atual</div>
<div class="balance" id="balance"></div>
<div class="stats">
<div class="stat"><span>Entradas</span><b class="in" id="income"></b></div>
<div class="stat"><span>Despesas</span><b class="out" id="expense"></b></div>
<div class="stat"><span>Gasto do salário</span><b id="percent">0%</b></div>
</div>
<div class="section"><div class="row"><span class="muted">Uso do salário</span><span class="muted" id="barText">0%</span></div><div class="progress"><div class="bar" id="bar"></div></div></div>
</section>

<section class="card section">
<div class="row"><div><b>Lançamentos</b><div class="subtitle">Suas movimentações</div></div><button class="smallbtn" onclick="openModal('txModal')">+ Novo</button></div>
<div class="transactions" id="transactions"></div>
</section>
</main>

<aside class="card">
<div><b>Minhas contas</b><div class="subtitle">Edite o saldo de cada conta</div></div>
<div class="accounts" id="accounts"></div>
</aside>
</div>
</div>

<div class="modal" id="salaryModal">
<div class="modalbox">
<div class="row"><h2>Editar salário</h2><button class="smallbtn" onclick="closeModal('salaryModal')">✕</button></div>
<div class="field"><label>Salário mensal</label><input id="salaryValue" type="number" min="0" step="0.01"></div>
<div class="actions"><button class="cancel" onclick="closeModal('salaryModal')">Cancelar</button><button class="primary" onclick="saveSalary()">Salvar</button></div>
</div>
</div>

<div class="modal" id="accountModal">
<div class="modalbox">
<div class="row"><h2>Editar conta</h2><button class="smallbtn" onclick="closeModal('accountModal')">✕</button></div>
<div class="field"><label>Conta</label><input id="accountName" readonly></div>
<div class="field"><label>Saldo atual</label><input id="accountValue" type="number" min="0" step="0.01"></div>
<div class="actions"><button class="cancel" onclick="closeModal('accountModal')">Cancelar</button><button class="primary" onclick="saveAccount()">Salvar</button></div>
</div>
</div>

<div class="modal" id="txModal">
<div class="modalbox">
<div class="row"><h2>Novo lançamento</h2><button class="smallbtn" onclick="closeModal('txModal')">✕</button></div>

<div class="field"><label>Tipo</label><select id="type" onchange="toggleInstallment()"><option value="expense">Despesa</option><option value="income">Entrada</option></select></div>
<div class="field"><label>Descrição</label><input id="desc" placeholder="Ex.: Compra online"></div>
<div class="field"><label>Valor</label><input id="value" type="number" min="0" step="0.01" placeholder="0,00"></div>
<div class="field"><label>Categoria</label><select id="category">
<option>Alimentação</option><option>Pessoal</option><option>Compras</option><option>Veículo</option><option>Extras</option>
</select></div>
<div class="field"><label>Conta</label><select id="account"></select></div>

<div class="field"><label>Pagamento</label><select id="payment" onchange="toggleInstallment()">
<option value="avista">À vista</option><option value="parcelado">Parcelado</option>
</select></div>

<div id="installmentFields" class="hidden">
<div class="field"><label>Quantidade de parcelas</label><input id="installments" type="number" min="2" step="1" placeholder="Ex.: 6"></div>
<div class="field"><label>Valor da primeira parcela</label><input id="firstInstallment" type="number" min="0" step="0.01" placeholder="Ex.: 100,00"></div>
<div class="field"><label>Mês da primeira parcela</label><input id="firstMonth" type="month"></div>
<div class="subtitle" style="margin-top:8px">A última parcela será calculada automaticamente.</div>
</div>

<div class="actions"><button class="cancel" onclick="closeModal('txModal')">Cancelar</button><button class="primary" onclick="saveTransaction()">Salvar</button></div>
</div>
</div>

<script>
const KEY='salazar_pay_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{
salary:1600,
accounts:{Caixa:800,Nubank:800,Dinheiro:0},
transactions:[]
};
if(!data.accounts.Dinheiro)data.accounts.Dinheiro=0;
let editingAccount='';

function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function totals(){
return {
income:data.transactions.filter(x=>x.type==='income').reduce((s,x)=>s+x.value,0),
expense:data.transactions.filter(x=>x.type==='expense').reduce((s,x)=>s+x.value,0)
}}
function render(){
const t=totals();
document.getElementById('salary').textContent=money(data.salary);
document.getElementById('income').textContent=money(t.income);
document.getElementById('expense').textContent=money(t.expense);
document.getElementById('balance').textContent=money(data.salary+t.income-t.expense);
const pct=data.salary?Math.min(100,(t.expense/data.salary)*100):0;
document.getElementById('percent').textContent=Math.round(pct)+'%';
document.getElementById('barText').textContent=Math.round(pct)+'%';
document.getElementById('bar').style.width=pct+'%';

document.getElementById('accounts').innerHTML=Object.entries(data.accounts).map(([name,val])=>
`<div class="account"><div><div class="account-name">${safe(name)}</div><div class="muted">Saldo</div></div>
<div class="account-actions"><b class="account-value">${money(val)}</b><button class="smallbtn" onclick="editAccount('${encodeURIComponent(name)}')">✏ Editar</button></div></div>`).join('');

document.getElementById('account').innerHTML=Object.keys(data.accounts).map(n=>`<option>${safe(n)}</option>`).join('');

const tx=document.getElementById('transactions');
if(!data.transactions.length)tx.innerHTML='<div class="empty">Nenhum lançamento ainda.<br>Use “+ Adicionar” para começar.</div>';
else tx.innerHTML=data.transactions.slice().reverse().slice(0,15).map(x=>{
let extra='';
if(x.payment==='parcelado'){
const last=lastInstallmentMonth(x.firstMonth,x.installments);
extra=`<div class="installment">Parcelado: ${x.installments}x • 1ª ${money(x.firstInstallment)} • ${formatMonth(x.firstMonth)} → última: ${formatMonth(last)}</div>`;
}
return `<div class="tx"><div><div class="tx-title">${safe(x.desc)}</div><small>${safe(x.category)} • ${safe(x.account)}</small>${extra}</div>
<b class="${x.type==='income'?'in':'out'}">${x.type==='income'?'+':'−'} ${money(x.value)}</b></div>`;
}).join('');
}
function safe(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function editSalary(){document.getElementById('salaryValue').value=data.salary;openModal('salaryModal')}
function saveSalary(){
const n=Number(document.getElementById('salaryValue').value);
if(!Number.isFinite(n)||n<0){alert('Valor inválido.');return}
data.salary=n;closeModal('salaryModal');save();
}
function editAccount(encoded){
editingAccount=decodeURIComponent(encoded);
document.getElementById('accountName').value=editingAccount;
document.getElementById('accountValue').value=data.accounts[editingAccount];
openModal('accountModal');
}
function saveAccount(){
const n=Number(document.getElementById('accountValue').value);
if(!Number.isFinite(n)||n<0){alert('Valor inválido.');return}
data.accounts[editingAccount]=n;closeModal('accountModal');save();
}
function openModal(id){document.getElementById(id).classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}

function toggleInstallment(){
const show=document.getElementById('type').value==='expense' && document.getElementById('payment').value==='parcelado';
document.getElementById('installmentFields').classList.toggle('hidden',!show);
}
function saveTransaction(){
  const descEl=document.getElementById('desc');
  const valueEl=document.getElementById('value');
  const typeEl=document.getElementById('type');
  const categoryEl=document.getElementById('category');
  const accountEl=document.getElementById('account');
  const paymentEl=document.getElementById('payment');

  const desc=descEl.value.trim();
  const value=Number(String(valueEl.value).replace(',','.'));
  const type=typeEl.value;
  const category=categoryEl.value;
  const account=accountEl.value;
  const payment=paymentEl.value;

  if(!desc){
    alert('Digite uma descrição para o lançamento.');
    descEl.focus();
    return;
  }
  if(!Number.isFinite(value) || value<=0){
    alert('Digite um valor válido.');
    valueEl.focus();
    return;
  }
  if(!account || !(account in data.accounts)){
    alert('Selecione uma conta válida.');
    return;
  }

  let tx={
    type:type,
    desc:desc,
    value:value,
    category:category,
    account:account,
    payment:payment,
    date:new Date().toISOString()
  };

  if(type==='expense' && payment==='parcelado'){
    const installments=Number(document.getElementById('installments').value);
    const firstInstallment=Number(String(document.getElementById('firstInstallment').value).replace(',','.'));
    const firstMonth=document.getElementById('firstMonth').value;

    if(!Number.isInteger(installments) || installments<2){
      alert('Informe a quantidade de parcelas (mínimo 2).');
      document.getElementById('installments').focus();
      return;
    }
    if(!Number.isFinite(firstInstallment) || firstInstallment<=0){
      alert('Informe o valor da primeira parcela.');
      document.getElementById('firstInstallment').focus();
      return;
    }
    if(!firstMonth){
      alert('Informe o mês da primeira parcela.');
      document.getElementById('firstMonth').focus();
      return;
    }

    tx.installments=installments;
    tx.firstInstallment=firstInstallment;
    tx.firstMonth=firstMonth;
  }

  data.transactions.push(tx);

  // O saldo da conta é alterado pelo valor informado no lançamento.
  data.accounts[account]=data.accounts[account]+(type==='income'?value:-value);

  descEl.value='';
  valueEl.value='';
  document.getElementById('payment').value='avista';
  document.getElementById('installments').value='';
  document.getElementById('firstInstallment').value='';
  document.getElementById('firstMonth').value='';
  toggleInstallment();

  closeModal('txModal');
  save();
}

function lastInstallmentMonth(first,count){
const [y,m]=first.split('-').map(Number);
const d=new Date(y,m-1+(count-1),1);
return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function formatMonth(v){
if(!v)return '';
const [y,m]=v.split('-').map(Number);
return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
}
render();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(console.error);
  });
}
</script>
</body>
</html>
