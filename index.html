<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087ea4">
<meta name="description" content="Cadastro e pesquisa rápida de clientes do AquaSalazar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>AquaSalazar</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f8fb;
    color: #17324d;
  }
  .app {
    max-width: 760px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 24px 16px 40px;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  .logo {
    font-size: 34px;
    font-weight: 800;
    color: #087ea4;
  }
  .subtitle {
    margin-top: 6px;
    color: #6b7c8c;
    font-size: 14px;
  }
  .search {
    width: 100%;
    border: 1px solid #d5e0e8;
    border-radius: 14px;
    padding: 15px 16px;
    font-size: 16px;
    outline: none;
    background: white;
    box-shadow: 0 3px 12px rgba(0,0,0,.04);
  }
  .search:focus { border-color: #087ea4; }
  .actions { margin: 14px 0 22px; }
  button {
    border: 0;
    border-radius: 12px;
    padding: 13px 17px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .primary { background: #087ea4; color: white; width: 100%; }
  .secondary { background: #eaf2f6; color: #24516d; }
  .danger { background: #fff0f0; color: #b3261e; }
  .section-title {
    font-size: 14px;
    font-weight: 700;
    color: #6b7c8c;
    margin-bottom: 10px;
  }
  .client {
    background: white;
    border: 1px solid #e0e8ee;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 10px;
    box-shadow: 0 3px 12px rgba(0,0,0,.035);
  }
  .client-name { font-weight: 800; font-size: 17px; }
  .client-address { margin-top: 6px; color: #536b7d; line-height: 1.4; }
  .client-actions { display: flex; gap: 8px; margin-top: 12px; }
  .client-actions button { flex: 1; }
  .empty {
    text-align: center;
    padding: 36px 15px;
    color: #7a8b98;
  }
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(14,35,50,.45);
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal.open { display: flex; }
  .modal-box {
    width: 100%;
    max-width: 520px;
    background: white;
    border-radius: 18px;
    padding: 22px;
    max-height: 92vh;
    overflow: auto;
  }
  .modal-box h2 { margin: 0 0 18px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin: 13px 0 6px;
    color: #526b7c;
  }
  input {
    width: 100%;
    padding: 13px;
    border: 1px solid #d5e0e8;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
  }
  .modal-actions { display: flex; gap: 9px; margin-top: 20px; }
  .modal-actions button { flex: 1; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">💧 AquaSalazar</div>
    <div class="subtitle">Cadastro rápido de clientes</div>
  </header>

  <input id="search" class="search" type="search" placeholder="🔎 Pesquisar cliente..." autocomplete="off">

  <div class="actions">
    <button class="primary" onclick="openModal()">＋ Cadastrar cliente</button>
  </div>

  <div style="display:flex;gap:8px;margin:0 0 22px;">
    <button class="secondary" style="flex:1;" onclick="exportBackup()">💾 Exportar backup</button>
    <button class="secondary" style="flex:1;" onclick="document.getElementById('backupFile').click()">📥 Restaurar backup</button>
    <input id="backupFile" type="file" accept=".json,application/json" style="display:none;">
  </div>

  <div class="section-title" id="count">Clientes cadastrados: 0</div>
  <div id="clients"></div>
</div>

<div id="modal" class="modal">
  <div class="modal-box">
    <h2 id="modalTitle">Novo cliente</h2>

    <label for="name">Nome *</label>
    <input id="name" placeholder="Ex.: João da Silva">

    <label for="phone">Telefone</label>
    <input id="phone" placeholder="Ex.: (73) 99999-9999">

    <label for="street">Rua</label>
    <input id="street" placeholder="Ex.: Rua Bahia">

    <label for="number">Número</label>
    <input id="number" placeholder="Ex.: 123">

    <label for="neighborhood">Bairro</label>
    <input id="neighborhood" placeholder="Ex.: Centro">

    <label for="reference">Ponto de referência</label>
    <input id="reference" placeholder="Ex.: Próximo à praça">

    <label for="photo">Foto da casa/fachada</label>
    <input id="photo" type="file" accept="image/*" capture="environment">

    <div id="photoPreview" style="margin-top:10px;"></div>

    <div class="modal-actions">
      <button class="secondary" onclick="closeModal()">Cancelar</button>
      <button class="primary" onclick="saveClient()">Salvar cliente</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "aquasalazar_clientes";
let clients = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let editingId = null;

const $ = id => document.getElementById(id);

function saveStorage() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(clients));
}

function openModal(id = null) {
  editingId = id;
  $("modalTitle").textContent = id ? "Editar cliente" : "Novo cliente";
  const c = clients.find(x => x.id === id);

  $("name").value = c?.name || "";
  $("phone").value = c?.phone || "";
  $("street").value = c?.street || "";
  $("number").value = c?.number || "";
  $("neighborhood").value = c?.neighborhood || "";
  $("reference").value = c?.reference || "";
  $("photo").value = "";
  $("photoPreview").innerHTML = c?.photo
    ? `<div style="font-size:13px;color:#6b7c8c;margin-bottom:5px;">Foto atual:</div><img src="${c.photo}" alt="Foto atual" style="width:100%;max-height:220px;object-fit:cover;border-radius:10px;">`
    : "";

  $("modal").classList.add("open");
  $("name").focus();
}

function closeModal() {
  $("modal").classList.remove("open");
  editingId = null;
  $("photo").value = "";
  $("photoPreview").innerHTML = "";
}

async function saveClient() {
  const name = $("name").value.trim();
  if (!name) {
    alert("Digite o nome do cliente.");
    $("name").focus();
    return;
  }

  let photo = clients.find(c => c.id === editingId)?.photo || "";
  const file = $("photo").files[0];

  if (file) {
    try {
      photo = await resizeImage(file, 1000, 0.78);
    } catch (err) {
      alert("Não foi possível salvar a foto.");
      return;
    }
  }

  const data = {
    id: editingId || Date.now(),
    name,
    phone: $("phone").value.trim(),
    street: $("street").value.trim(),
    number: $("number").value.trim(),
    neighborhood: $("neighborhood").value.trim(),
    reference: $("reference").value.trim(),
    photo
  };

  if (editingId) {
    clients = clients.map(c => c.id === editingId ? data : c);
  } else {
    clients.unshift(data);
  }

  saveStorage();
  closeModal();
  render();
}

function deleteClient(id) {
  const c = clients.find(x => x.id === id);
  if (!c) return;
  if (confirm(`Excluir o cliente "${c.name}"?`)) {
    clients = clients.filter(x => x.id !== id);
    saveStorage();
    render();
  }
}

function exportBackup() {
  if (!clients.length) {
    alert("Não há clientes cadastrados para fazer backup.");
    return;
  }

  const backup = {
    app: "AquaSalazar",
    version: 1,
    createdAt: new Date().toISOString(),
    clients
  };

  const blob = new Blob([JSON.stringify(backup, null, 2)], {
    type: "application/json"
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const date = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `AquaSalazar-backup-${date}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);

  alert("Backup exportado com sucesso. Guarde esse arquivo em um local seguro.");
}

$("backupFile").addEventListener("change", async (event) => {
  const file = event.target.files[0];
  if (!file) return;

  try {
    const text = await file.text();
    const backup = JSON.parse(text);

    if (!backup || backup.app !== "AquaSalazar" || !Array.isArray(backup.clients)) {
      throw new Error("Formato inválido");
    }

    const validClients = backup.clients.filter(c => c && c.name).map(c => ({
      id: c.id || Date.now() + Math.random(),
      name: String(c.name || ""),
      phone: String(c.phone || ""),
      street: String(c.street || ""),
      number: String(c.number || ""),
      neighborhood: String(c.neighborhood || ""),
      reference: String(c.reference || ""),
      photo: typeof c.photo === "string" ? c.photo : ""
    }));

    if (!confirm(
      `O backup contém ${validClients.length} cliente(s). ` +
      `Restaurar vai substituir os clientes atuais deste navegador. Continuar?`
    )) {
      event.target.value = "";
      return;
    }

    clients = validClients;
    saveStorage();
    render();

    alert(`Backup restaurado com sucesso: ${clients.length} cliente(s).`);
  } catch (error) {
    alert("Não foi possível restaurar esse backup. Verifique se o arquivo é do AquaSalazar.");
  } finally {
    event.target.value = "";
  }
});

function resizeImage(file, maxSize = 1000, quality = 0.78) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        const scale = Math.min(1, maxSize / Math.max(width, height));
        width = Math.round(width * scale);
        height = Math.round(height * scale);

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

$("photo").addEventListener("change", async () => {
  const file = $("photo").files[0];
  if (!file) {
    $("photoPreview").innerHTML = "";
    return;
  }
  const preview = await resizeImage(file, 700, 0.7);
  $("photoPreview").innerHTML =
    `<div style="font-size:13px;color:#6b7c8c;margin-bottom:5px;">Prévia:</div>
     <img src="${preview}" alt="Prévia da foto" style="width:100%;max-height:220px;object-fit:cover;border-radius:10px;">`;
});

function render() {
  const q = $("search").value.trim().toLowerCase();
  const filtered = clients.filter(c =>
    [c.name, c.phone, c.street, c.neighborhood, c.reference]
      .join(" ").toLowerCase().includes(q)
  );

  $("count").textContent = `Clientes cadastrados: ${clients.length}`;

  if (!filtered.length) {
    $("clients").innerHTML = `<div class="empty">${q ? "Nenhum cliente encontrado." : "Nenhum cliente cadastrado ainda."}</div>`;
    return;
  }

  $("clients").innerHTML = filtered.map(c => {
    const address = [c.street, c.number].filter(Boolean).join(", ");
    const line = [address, c.neighborhood].filter(Boolean).join(" — ");
    return `
      <div class="client">
        <div class="client-name">${escapeHtml(c.name)}</div>
        ${line ? `<div class="client-address">📍 ${escapeHtml(line)}</div>` : ""}
        ${c.phone ? `<div class="client-address">📞 ${escapeHtml(c.phone)}</div>` : ""}
        ${c.reference ? `<div class="client-address">📌 ${escapeHtml(c.reference)}</div>` : ""}
        ${c.photo ? `<img src="${c.photo}" alt="Foto da casa de ${escapeHtml(c.name)}" style="width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-top:12px;">` : ""}
        <div class="client-actions">
          <button class="secondary" onclick="openModal(${c.id})">Editar</button>
          <button class="danger" onclick="deleteClient(${c.id})">Excluir</button>
        </div>
      </div>`;
  }).join("");
}

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  }[ch]));
}

$("search").addEventListener("input", render);
$("modal").addEventListener("click", e => {
  if (e.target === $("modal")) closeModal();
});

render();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(err => {
      console.log("Service Worker:", err);
    });
  });
}
</script>
</body>
</html>
